[workspace]

[package]
name = "ktlsp-oracle-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
ktlsp-protocol = { path = "../../crates/ktlsp-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false, features = ["std", "force-soft"] }
