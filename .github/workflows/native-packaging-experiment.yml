# Source-only child #325; source PR remains on root aggregate #324 HOLD.
# No dispatch/execution proof is implied by source review or ordinary native CI.
# Manual, experimental evidence only; dispatch requires a separate root admission
# after the reviewed paired worker/symbol product is verified on default-branch main.
# This does not close #96 or the #46/specs/parity.md release gate.
name: Experimental native packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      RUSTC_BOOTSTRAP: ''
    steps:
      - name: Admit immutable default-branch source only
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP/native-package-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          @{
            source_sha = $env:SOURCE_SHA
            source_ref = $env:SOURCE_REF
            workflow_sha = $env:WORKFLOW_SHA
            workflow_ref = $env:WORKFLOW_REF
            repository = $env:REPOSITORY
            default_branch = $env:DEFAULT_BRANCH
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os_description = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            powershell = $PSVersionTable.PSVersion.ToString()
          } | ConvertTo-Json | Set-Content "$evidence/identity.json" -Encoding utf8NoBOM
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_REF -cne "refs/heads/$env:DEFAULT_BRANCH" -or
              $env:WORKFLOW_SHA -cne $env:SOURCE_SHA -or
              $env:WORKFLOW_REF -cne "$env:REPOSITORY/.github/workflows/native-packaging-experiment.yml@refs/heads/$env:DEFAULT_BRANCH") {
            throw 'Only the immutable dispatch SHA and its default-branch workflow are admitted'
          }
          @(
            "CARGO_HOME=$env:RUNNER_TEMP/native-package-cargo"
            "CARGO_TARGET_DIR=$env:RUNNER_TEMP/native-package-target"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: actions/checkout@v4
        # Match the shared preflight and final packaging cleanliness check.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install and record pinned Rust toolchain and source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP/native-package-evidence"
          # #329: retain bounded original PowerShell facts and complementary raw
          # queries; persist the same byte policy used by the initial checkout.
          & ./tools/ci/native-source-preflight.ps1 -EvidenceDirectory $evidence
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy 2>&1 | Tee-Object "$evidence/toolchain-install.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.99.0 -vV 2>&1 | Tee-Object "$evidence/rustc.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 -Vv 2>&1 | Tee-Object "$evidence/cargo.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format
        run: |
          cargo +1.99.0 fmt --all -- --check 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-package-evidence/format.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locked workspace Clippy
        run: |
          cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-package-evidence/clippy.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build both matching release executables
        run: |
          $ErrorActionPreference = 'Stop'
          $log = "$env:RUNNER_TEMP/native-package-evidence/release-build.txt"
          cargo +1.99.0 build --locked --release -p ktlsp-server -p ktlsp-parser --bin ktlsp --bin ktlsp-parser-worker 2>&1 | Tee-Object $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Cargo has previously returned zero after a rust-objcopy SIGABRT.
          # Do not turn that missing-LLVM/stripping failure into package success.
          if (Select-String -Path $log -Pattern 'rust-objcopy|libLLVM|SIGABRT|signal: 6|failed to strip|stripping.*failed' -Quiet) {
            throw 'Build-child/stripping diagnostic requires investigation; no package admitted'
          }
      - name: Full locked release workspace tests, including real CLI, stdio and document_symbols
        run: |
          cargo +1.99.0 test --locked --release --workspace 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-package-evidence/workspace-tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage paired binaries, applicable notices, provenance and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP/native-package-evidence"
          if (Select-String -Path "$evidence/release-build.txt", "$evidence/workspace-tests.txt" -Pattern 'rust-objcopy|libLLVM|SIGABRT|signal: 6|failed to strip|stripping.*failed' -Quiet) {
            throw 'Native build/test child failure; no package admitted'
          }
          $stage = "$env:RUNNER_TEMP/native-package"
          New-Item -ItemType Directory "$stage/third-party", "$stage/build-evidence" | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          foreach ($name in @('ktlsp', 'ktlsp-parser-worker')) {
            Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR/release/$name$suffix" -Destination $stage
          }
          Copy-Item -LiteralPath 'crates/ktlsp-parser/notices' -Destination "$stage/third-party/parser" -Recurse
          Copy-Item -LiteralPath 'vendor/ktrs-parser-0.5.1/PROVENANCE.md' -Destination "$stage/third-party/parser/vendor-PROVENANCE.md"
          Copy-Item -LiteralPath 'Cargo.lock', '.github/workflows/native-packaging-experiment.yml' -Destination "$stage/build-evidence"
          Copy-Item -Path "$evidence/*" -Destination "$stage/build-evidence"
          $metadataText = cargo +1.99.0 metadata --locked --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataText | ConvertFrom-Json
          $pending = [System.Collections.Generic.Queue[string]]::new()
          foreach ($package in $metadata.packages) {
            if ($package.name -cin @('ktlsp-server', 'ktlsp-parser')) { $pending.Enqueue($package.id) }
          }
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          $dependencies = @()
          while ($pending.Count -gt 0) {
            $id = $pending.Dequeue()
            if (-not $seen.Add($id)) { continue }
            $package = $metadata.packages | Where-Object { $_.id -ceq $id }
            $node = $metadata.resolve.nodes | Where-Object { $_.id -ceq $id }
            if ($null -eq $package -or $null -eq $node) { throw "Missing locked package: $id" }
            foreach ($dependency in $node.deps) {
              if (@($dependency.dep_kinds | Where-Object { $null -eq $_.kind -or $_.kind -ceq 'build' }).Count -gt 0) {
                $pending.Enqueue($dependency.pkg)
              }
            }
            $dependencies += @{ name = $package.name; version = $package.version; source = $package.source; license = $package.license }
            if ($null -eq $package.source) { continue }
            # Published ktrs archives omit notices; retained upstream copies above cover them.
            if ($package.name -cin @('ktrs-syntax', 'ktrs-lexer', 'text-size')) { continue }
            $root = Split-Path $package.manifest_path
            $notices = @(Get-ChildItem -LiteralPath $root -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)([.-].*)?$' })
            if ($package.license_file) {
              $notices += Get-Item -LiteralPath (Join-Path $root $package.license_file)
            }
            if ($notices.Count -eq 0) { throw "No retained license/notice for $id" }
            $destination = "$stage/third-party/$($package.name)-$($package.version)"
            New-Item -ItemType Directory $destination | Out-Null
            $notices | Sort-Object FullName -Unique | Copy-Item -Destination $destination
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.Count -ne 0) { throw 'Source changed during native checks/build' }
          $contents = @(Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { [System.IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/') })
          @{
            experimental = $true
            repository = $env:REPOSITORY
            commit = $env:SOURCE_SHA
            tree = (Get-Content "$evidence/source-tree.txt" -Raw).Trim()
            workflow_sha = $env:WORKFLOW_SHA
            run_url = "https://github.com/$env:REPOSITORY/actions/runs/$env:RUN_ID/attempts/$env:RUN_ATTEMPT"
            runner_os = $env:RUNNER_OS_NAME
            runner_arch = $env:RUNNER_ARCH_NAME
            os_description = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            os_architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            process_architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            rustc = @(Get-Content "$evidence/rustc.txt")
            cargo = @(Get-Content "$evidence/cargo.txt")
            profile = 'release (repository defaults; no overrides)'
            dependencies = $dependencies
            contents = @($contents + @('provenance.json', 'SHA256SUMS') | Sort-Object)
            first_party_license = 'No first-party license grant is present in this source tree; no license is invented by this artifact.'
            limits = 'Native-only experimental evidence, not editor/oracle/parity certification or general platform support. #96 remains OPEN/UNKNOWN; parser 500ms bounds are unchanged. #46 and the full parity release gate remain open.'
          } | ConvertTo-Json -Depth 8 | Set-Content "$stage/provenance.json" -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $path = [System.IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $path"
          } | Set-Content "$stage/SHA256SUMS" -Encoding utf8NoBOM
          $name = "ktlsp-experimental-$env:RUNNER_OS_NAME-$env:RUNNER_ARCH_NAME-$env:SOURCE_SHA"
          tar -czf "$env:RUNNER_TEMP/$name.tar.gz" -C $stage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/$name.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant())  $name.tar.gz" | Set-Content "$env:RUNNER_TEMP/$name.tar.gz.sha256" -Encoding utf8NoBOM
      - name: Preserve original native evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-package-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-package-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental package only after all proofs pass
        uses: actions/upload-artifact@v4
        with:
          name: ktlsp-experimental-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ktlsp-experimental-*.tar.gz
            ${{ runner.temp }}/ktlsp-experimental-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
